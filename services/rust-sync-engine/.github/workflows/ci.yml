name: Rust Sync Engine CI

on:
  push:
    branches: [main]
    paths:
      - 'services/rust-sync-engine/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/rust-sync-engine/**'

env:
  CARGO_TERM_COLOR: always
  rust_version: stable
  toolchain_version: "1.75"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_version }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/rust-sync-engine

      - name: Check formatting
        run: cargo fmt --check
        working-directory: services/rust-sync-engine

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: services/rust-sync-engine

      - name: Build
        run: cargo build --verbose
        working-directory: services/rust-sync-engine

      - name: Run tests
        run: cargo test --verbose
        working-directory: services/rust-sync-engine

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -f services/rust-sync-engine/docker/Dockerfile \
            -t sobatwarung/sync-engine:latest \
            services/rust-sync-engine

  grpc-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf
        run: sudo apt-get install -y protobuf-compiler

      - name: Check proto generation
        run: |
          cd services/rust-sync-engine
          protoc --proto_path=proto \
            --go_out=plugins=grpc:. \
            proto/*.proto || true
